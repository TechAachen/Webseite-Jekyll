  description: |
    Wir sind Aixtreme Racing – das Motorsport-Team der FH Aachen. Seit mehr als 15 Jahren entwickeln und bauen wir jedes Jahr einen eigenen Formula-Student-Rennwagen. Auf internationalen Wettbewerben messen wir uns mit fast 600 Teams aus aller Welt. Dabei geht es nicht nur um Technik, sondern auch um Teamgeist, Ausdauer und den Mut, neue Wege zu gehen.

